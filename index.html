<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starve Neon</title>
    <style>
        body {
            margin: 0;
            padding: 2rem 1rem;
            background: #0b0b12;
            color: #d0d0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        main {
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            margin: 0 0 0.3rem;
        }
        h1 span {
            color: #c44eff;
        }
        p {
            line-height: 1.6;
            margin: 0.8rem 0;
            color: #aaa;
        }
        .links {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: center;
        }
        a {
            display: inline-block;
            background: #c44eff;
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            transition: background 0.2s;
            width: fit-content;
        }
        a:hover {
            background: #da80ff;
        }
        a.alt {
            background: transparent;
            border: 1px solid #c44eff;
            color: #c44eff;
        }
        a.alt:hover {
            background: rgba(196,78,255,0.1);
        }
        .specs {
            font-size: 0.85rem;
            color: #666;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>STARVE<br><span>NEON</span></h1>
        <p>Хардкорное выживание в мире.</p>
        
        <p style="font-size: 0.9rem; color: #999;">
            Сбор ресурсов, крафт, фракции, PvP.<br>
            Windows / Android · Ранний доступ
        </p>

        <div class="links">
            <a href="https://neonshadowyt.github.io/NeonImperium/starve-neon" target="_blank">🌐 Играть / Подробнее</a>
            <a href="https://github.com/NeonShadowYT/NeonImperium" target="_blank" class="alt">📁 Исходный код</a>
        </div>

        <div class="specs">
            Мин.: Xeon E5‑2650 v2 + GT 730<br>
            Оптим.: Ryzen 7 7435HS + RTX 3050
        </div>
    </main>
</body>
</html>
