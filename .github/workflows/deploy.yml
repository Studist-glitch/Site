name: Deploy PHP to GitHub Pages

on:
  push:
    branches: [ "main" ] # Запускать при пуше в ветку main
  workflow_dispatch:      # Дает возможность запускать вручную

# Права доступа для токена
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Установка PHP (версия 8.2)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # Запуск вашего PHP-скрипта
      - name: Run PHP script to generate HTML
        run: php generate.php # Замените на имя вашего PHP-файла

      # Настройка для GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Загрузка сгенерированных файлов как артефакта
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Папка с вашими HTML-файлами (корень по умолчанию)

      # Публикация артефакта на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4