<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .message {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            font-family: system-ui, 'Segoe UI', monospace;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 1rem 2rem;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            pointer-events: none;
        }
        a {
            color: #ffaa44;
            text-decoration: none;
            pointer-events: auto;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline>
        <source src="images/404.webm" type="video/webm">
    </video>
    <div class="message">
        ⚡ 404 – Страница не найдена<br>
        <a href="/">← Вернуться на главную</a>
    </div>
</body>
</html>
